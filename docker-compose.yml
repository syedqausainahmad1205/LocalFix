services:
  db:
    image: postgres:16
    container_name: localfix-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: localfix
      POSTGRES_USER: localfix_user
      POSTGRES_PASSWORD: localfix_password
    ports:
      - "5432:5432"
    volumes:
      - localfix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U localfix_user -d localfix"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  localfix_postgres_data:
