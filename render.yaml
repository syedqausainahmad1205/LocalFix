# Render Blueprint for LocalFix Platform (Unified All-in-One Architecture)
# Deploys Managed PostgreSQL 16 and a Single FastAPI + React Web Service
# Result: Render creates EXACTLY 1 Single Working URL where everything is integrated!

databases:
  - name: localfix-db
    plan: free
    region: oregon
    databaseName: localfix
    user: localfix_user

services:
  # Single Unified Web Service: Serves React Frontend + FastAPI Backend + Auto-seeds PostgreSQL
  - type: web
    name: localfix
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m app.db.init_db && python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: localfix-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: EMAIL_TEST_MODE
        value: "true"
