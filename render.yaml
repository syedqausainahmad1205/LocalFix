# Render Blueprint for LocalFix Platform
# Deploys Managed PostgreSQL 16, FastAPI Backend, and React 19 Frontend with 1 Click

databases:
  - name: localfix-db
    plan: free
    region: oregon
    databaseName: localfix
    user: localfix_user

services:
  # 1. FastAPI Python Backend Web Service
  - type: web
    name: localfix-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m app.db.init_db && python -m app.db.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: localfix-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: EMAIL_TEST_MODE
        value: "true"

  # 2. React 19 + Vite Frontend Static Site
  - type: web
    name: localfix-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: localfix-backend
          property: host
